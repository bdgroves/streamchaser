name: Streamchaser

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would post, post nothing"
        type: boolean
        default: false

jobs:
  chase:
    name: Fetch - Chart - Post
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      CHART_OUTPUT_DIR: "/tmp"
      PYTHONPATH:       "src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install matplotlib numpy requests Pillow tweepy atproto

      - name: Run Streamchaser
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          BLUESKY_HANDLE:        ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD:  ${{ secrets.BLUESKY_APP_PASSWORD }}
          # X stands by until this repo variable is set to "on"
          # (Settings → Secrets and variables → Actions → Variables).
          POST_TO_X:             ${{ vars.POST_TO_X }}
          DRY_RUN:               ${{ inputs.dry_run && '1' || '' }}
        run: python -m streamchaser

      # Remember what posted (state.json) and every post attempt. Only commits
      # when something changed, so quiet hours add no commits.
      - name: Save state and post log
        if: always()
        run: |
          git config user.name  "streamchaser-bot"
          git config user.email "bot@streamchaser"
          git add state.json logs/posts.jsonl 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: update streamchaser state [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done

      - name: Publish charts to the charts branch
        if: always()
        run: |
          mkdir -p chart
          # Start from the charts already published, so stations that didn't
          # redraw this run keep their last chart.
          git fetch -q --depth 1 origin charts 2>/dev/null && git archive FETCH_HEAD | tar -x -C chart || true

          # Copy latest chart for each station by picking the newest matching file
          copy_latest() {
            local sid=$1
            local dest=$2
            local f=$(ls -t /tmp/streamchaser_${sid}_*.png 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp "$f" "chart/${dest}.png"; fi
          }

          # Tuolumne chain
          copy_latest 11276500 hetch_hetchy
          copy_latest 11274790 tuolumne_grand_canyon
          copy_latest 11276900 tuolumne_early_intake
          copy_latest 11289650 tuolumne_lagrange
          copy_latest 11290000 tuolumne_modesto

          # Merced
          copy_latest 11264500 merced_happy_isles
          copy_latest 11266500 merced_pohono

          # Stanislaus
          copy_latest 11303000 stanislaus_ripon

          # Local tributaries
          copy_latest 11284400 big_creek
          copy_latest 11278300 cherry_creek

          # latest.png = Big Creek for README default
          if [ -f chart/big_creek.png ]; then cp chart/big_creek.png chart/latest.png; fi

          # Publish the charts as a single-commit "charts" branch, replaced every
          # run. Committing them to main kept every hourly version forever and
          # grew the repo past 1.5 GB. The README reads from this branch.
          [ -n "$(ls chart/*.png 2>/dev/null)" ] || { echo "No charts this run"; exit 0; }
          tmp=$(mktemp -d)
          cp chart/*.png "$tmp"/
          # The latest run log rides along (replaced each run, no history kept).
          cp "$GITHUB_WORKSPACE/logs/last_run.log" "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          git init -q -b charts
          git config user.name  "streamchaser-bot"
          git config user.email "bot@streamchaser"
          git add -A
          git commit -q -m "charts: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save chart artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-${{ github.run_number }}
          path: /tmp/streamchaser_*.png
          retention-days: 5
